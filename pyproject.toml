[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoblue-claims"
version = "0.1.0"
description = "Local claim records and deterministic helpers for a Codex GeoBlue skill"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
geoblue-claims = "geoblue_claims.cli:main"

[tool.setuptools.packages.find]
include = ["geoblue_claims*"]
